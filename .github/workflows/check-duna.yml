name: Checar sessões IMAX Duna Parte 3

on:
  schedule:
    # A cada 30 min, mas deslocado de :00/:30 pra fora do pico de carga do
    # GitHub Actions (todo mundo dispara junto nesses horários redondos).
    # Ajuste para */10 ou */5 perto da estreia (15/12/2026).
    - cron: "7,37 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para commitar o state.json de volta

concurrency:
  group: duna-imax-watcher-run
  cancel-in-progress: false # deixa a execução anterior terminar em vez de cancelar

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar verificação
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_duna_imax.py

      - name: Commitar novo estado (se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0

          git commit -m "Atualiza sessões vistas [skip ci]"

          for tentativa in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push feito com sucesso na tentativa $tentativa."
              exit 0
            fi
            echo "Push falhou (tentativa $tentativa), tentando de novo em 5s..."
            git rebase --abort >/dev/null 2>&1 || true
            sleep 5
          done

          echo "Não foi possível dar push após várias tentativas."
          exit 1